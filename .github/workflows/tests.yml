name: tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        include:
          - laravel: '11'
            testbench: '^9.0'
            # Every 11.x release has an open security advisory, so composer refuses to
            # resolve it. This leg exists to test against the oldest supported API.
            composer-flags: '--no-security-blocking'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      # composer.lock is gitignored, so each leg resolves fresh: 8.4 and 8.5 pick symfony 8, 8.3 picks symfony 7.
      # The framework is pinned per leg so that an API only some Laravel versions have cannot ship unnoticed.
      # thijssensoftware/request-id comes from a VCS repository, and composer reads its tags through the
      # GitHub API; the token lifts the 60/hour unauthenticated limit that runner IPs share.
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer require --dev --no-update --no-interaction "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.composer-flags }}

      - name: Run CI checks
        if: matrix.laravel == '13'
        run: composer ci:check

      # PHPStan analyses against the installed framework, so on 11 and 12 it reports
      # version differences (a property only 13 has) and Spool types that 13 does
      # not. Types are checked once, against the newest; the older legs lint, and
      # the coverage step below runs their tests.
      - name: Run lint
        if: matrix.laravel != '13'
        run: composer lint:check

      # The package runs inside every app in the estate, which makes it the
      # worst place to have weaker checks than the apps it watches.
      - name: Enforce 100% test coverage
        run: composer test:coverage
